<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1b2a">
  <title>Sign in · CyberAudit · TrinTech Digital Defense</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0d1b2a'},teal:{DEFAULT:'#1b8a8f',50:'#eef8f9'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <style>body{font-family:Inter,system-ui,sans-serif;background:#f4f6f8;}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex w-12 h-12 rounded-xl bg-navy items-center justify-center mb-4">
        <svg class="w-7 h-7 text-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-navy tracking-tight">CyberAudit</h1>
      <p class="text-sm text-teal font-medium mt-1">{{ company.name }}</p>
      <p class="text-xs text-slate-500 mt-2">{{ company.tagline }}</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <h2 class="text-sm font-semibold text-navy mb-1">Sign in</h2>
      <p class="text-xs text-slate-500 mb-5">Authorised personnel only. Sessions are logged.</p>
      {% if error %}<div class="mb-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-lg px-3 py-2">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5" for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-teal focus:ring-2 focus:ring-teal/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-teal focus:ring-2 focus:ring-teal/20">
        </div>
        <button type="submit" class="w-full bg-teal text-white font-semibold text-sm rounded-lg py-2.5 hover:bg-[#167277]">Sign in securely</button>
      </form>
    </div>
    <p class="text-center text-[11px] text-slate-400 mt-6">Point-in-time audits · Hardened &amp; auditable · CMA Chap. 11:17<br>{{ company.email }} · {{ company.phone }}</p>
  </div>
</body>
</html>
