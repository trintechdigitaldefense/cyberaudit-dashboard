name: CyberAudit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit pypdf
      - name: Syntax compile
        run: python -m compileall -q cyberaudit
      - name: Full pytest discovery
        env:
          DEMO_MODE: "1"
          CYBERAUDIT_SECRET: "ci-test-secret-32-characters-ok!!"
          CYBERAUDIT_ROE_SECRET: "ci-roe-secret-32-characters-ok!!!"
          CYBERAUDIT_REPORT_SECRET: "ci-report-secret-32-characters-ok"
          CYBERAUDIT_DATA_DIR: /tmp/ca_ci_data
          CYBERAUDIT_REPORTS_DIR: /tmp/ca_ci_reports
          CYBERAUDIT_DB_PATH: /tmp/ca_ci_data/cyber_audit.db
        run: |
          mkdir -p /tmp/ca_ci_data /tmp/ca_ci_reports
          python -m pytest tests/ -q --tb=line
      - name: Dependency audit
        run: pip-audit -r requirements.txt
