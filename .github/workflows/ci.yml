name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile dashboard_app.py pipeline_client_example.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
